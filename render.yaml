version: "1"
services:
- type: web
  name: kenya-ai-competition
  runtime: python
  repo: https://github.com/Wangadeveloper/kenya-ai-competition
  plan: free
  envVars:
  - key: WHATSAPP_PHONE_NUMBER_ID
    sync: false
  - key: WHATSAPP_TOKEN
    sync: false
  - key: AFRICASTALKING_API_KEY
    sync: false
  - key: AFRICASTALKING_USERNAME
    sync: false
  - key: NEO4J_DATABASE
    sync: false
  - key: NEO4J_PASSWORD
    sync: false
  - key: NEO4J_USERNAME
    sync: false
  - key: NEO4J_URI
    sync: false
  - key: DATABASE_URL
    sync: false
  - key: GEMINI_API_KEY
    sync: false
  - key: SECRET_KEY
    sync: false
  region: frankfurt
  buildCommand: pip install -r requirements.txt
  startCommand: gunicorn "run:create_app()"
  autoDeployTrigger: commit
